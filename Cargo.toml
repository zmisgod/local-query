[package]
name = "local-query"
version = "0.1.0"
edition = "2021"
default-run = "lselect"

[[bin]]
name = "lselect"
path = "src/main.rs"

[dependencies]
csv = "1.3.0"
serde = "1.0"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sqlparser = "0.39.0"
anyhow = "1.0"
bigdecimal = "0.4"
